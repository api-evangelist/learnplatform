aid: learnplatform
name: LearnPlatform
description: 'LearnPlatform by Instructure is an edtech effectiveness system used by
  K-12 school districts to organize, streamline, and analyze their education technology.
  It provides an inventory dashboard of the tools students and educators actually use,
  rapid-cycle evaluation for measuring impact, ESSA Evidence Badges developed in consultation
  with the U.S. Department of Education and the Institute of Education Sciences, request
  and approval workflows, student data privacy and compliance review, and public product
  libraries for family communication. LearnPlatform Inc. was a Techstars portfolio company
  and was acquired by Instructure in January 2023; learnplatform.com now redirects into
  instructure.com product, policy, and support pages, while the application itself is
  served from app.learnplatform.com. LearnPlatform publishes no public developer API,
  OpenAPI definition, or SDK surface of its own — Instructure''s public developer program
  (developerdocs.instructure.com) covers Canvas LMS and related services, not LearnPlatform.'
